<script>
(() => {
"use strict";
/* ---------- constants ---------- */
const EPOCH = new Date(2026, 5, 11); // day No. 1 = 11 June 2026
const N = 5, MAX = N * 100;
const SCORE = [100, 70, 45, 25, 10]; // points by how many years off
const tierVar = p => p >= 85 ? "--t85" : p >= 60 ? "--t60" : p >= 30 ? "--t30" : "--t10";

/* ---------- storage (per device) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem("needle:"+k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("needle:"+k, JSON.stringify(v)); } catch {} }
};

/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/&/g," and ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function rng(seed){ let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  const pts = r ? r.answers.map(a => a ? a.pts : 0) : [];
  const label = r?.done ? "See your record" : r?.answers?.length ? `Keep going · song ${r.answers.length + 1} of ${N}` : "Start today’s record";
  prefetch(tracks[r?.answers?.length || 0]);
  return `${deskbar("home")}<div class="view">
  <div class="top mobilebar"><div class="wordmark">needle</div><span class="pill"><span class="dot"></span>${streak()}-day streak</span></div>
  <div class="split">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-direction:column;gap:6px"><span class="lab">No. ${n} · ${esc(fmtDate(dateOf(n)))}</span><h1>${esc(theme.name)}</h1><p class="sub" style="margin:0;max-width:44ch">${esc(theme.blurb)}</p></div>
      <div class="center mobile-only" style="padding:6px 0">${recordEl(pts, { arm: true, armRest: !pts.length, shadow: true, size: 240, label: "No. " + n })}</div>
      <button class="btn" data-act="start">${label}${I.arrow}</button>
      <span class="lab" style="text-align:center">${N} songs · guess the year · about 2 min</span>
      ${y?.done ? `<button class="yesterday" data-act="day" data-day="${n - 1}"><span class="rec" style="--rs:44px;width:44px;margin:0">${recordSVG(y.answers.map(a => a ? a.pts : 0))}</span><span class="grow"><span class="lab">Yesterday · ${esc(themeForDay(n - 1).name)}</span><span style="display:block;font-weight:500">${y.score} pts</span></span>${I.chev}</button>` : ""}
    </div>
    <div class="center desk-only">${recordEl(pts, { arm: true, armRest: !pts.length, shadow: true, size: 440, label: "No. " + n })}</div>
  </div></div>${mobileNav("home")}`;
}
function playHead() {
  const pts = state.run.answers.map(a => a ? a.pts : 0);
  return `<div class="playhead"><button class="iconbtn" data-act="quit" aria-label="Leave and save progress">${I.close}</button>
  <div class="steps" aria-label="Song ${state.idx + 1} of ${N}">${Array.from({ length: N }, (_, i) => `<i class="${i < state.run.answers.length && !(state.view === "prompt" && i === state.idx) ? "done" : ""} ${i === state.idx ? "now" : ""}"></i>`).join("")}</div>
  <div class="score-mini"><span class="rec" style="--rs:24px;width:24px;margin:0">${recordSVG(pts)}</span><span class="num">${state.run.score}</span></div></div>`;
}
const readout = () => state.guess != null ? `<span class="lab">Your guess</span><b class="mono">${state.guess}</b>` : `<span class="sub">Tap the year you think it was a hit.</span>`;
function viewPrompt() {
  const th = curTheme(), s = curTrack(), on = playingKey === s.key;
  return `<div class="view" style="max-width:560px;margin:0 auto;width:100%">${playHead()}
  <div class="q"><span class="lab">Song ${state.idx + 1} of ${N} · ${esc(th.name)}</span><h2>When was this a hit?</h2></div>
  <div class="youcard">${coverEl(s, 56, 10).replace('class="cv"', `class="cv ${on ? "spin" : ""}"`)}<div class="grow"><div class="t1" style="font-size:17px">${esc(s.t)}</div><div class="t2">${esc(s.a)}</div></div>
    <button class="playbtn" data-play="${esc(s.key)}" aria-label="${on ? "Stop" : "Play"} ${esc(s.t)}">${on ? I.pause : I.play}</button></div>
  <div id="board" class="board" tabindex="0" aria-label="Year dial. Going clockwise from the top is ${th.range[0]} to ${th.range[1]}. Arrow keys move the needle, Enter drops it.">${dialSVG(th, { guess: state.guess })}</div>
  <div id="readout" class="readout">${readout()}</div>
  <div class="sticky"><button id="drop" class="btn" data-act="drop" ${state.guess != null ? "" : "disabled"} style="justify-content:center">Drop the needle</button></div>
  </div>`;
}
function updateBoard() {
  const b = $("#board"); if (!b) return; b.innerHTML = dialSVG(curTheme(), { guess: state.guess });
  $("#readout").innerHTML = readout(); const d = $("#drop"); if (d) d.disabled = state.guess == null;
}
function songRow(s, role, deep) {
  const saved = savedSongs().includes(s.key), on = playingKey === s.key;
  return `<div class="lrow"><span class="tier" style="background:var(${tierVar(Math.round((1 - s.known) * 100))})"></span>${coverEl(s, 44).replace('class="cv"', `class="cv ${on ? "spin" : ""}"`)}
  <span class="grow">${role ? `<span class="lab ${deep ? "deep" : ""}" style="font-size:10px;display:block">${role}</span>` : ""}<span class="t1" style="display:block">${esc(s.t)}</span><span class="t2" style="display:block">${esc(s.a)} · ${chartRun(s)}</span></span>
  <button class="playbtn o" data-play="${esc(s.key)}" aria-label="${on ? "Stop" : "Play"} ${esc(s.t)}">${on ? I.pause : I.play}</button>
  <button class="iconbtn ${saved ? "on" : ""}" data-save="${esc(s.key)}" aria-label="${saved ? "Remove" : "Save"} ${esc(s.t)}">${saved ? I.check : I.plus}</button></div>`;
}
function neighbours(s, y) {
  const r = s.ranks[y];
  return CATALOG.filter(x => x !== s && x.ranks[y] != null).sort((a, b) => Math.abs(a.ranks[y] - r) - Math.abs(b.ranks[y] - r)).slice(0, 2);
}
function viewReveal() {
  const th = curTheme(), a = state.run.answers[state.idx], s = BYKEY.get(a.key), on = playingKey === s.key, saved = savedSongs().includes(s.key), nb = neighbours(s, a.y);
  return `<div class="view" style="max-width:560px;margin:0 auto;width:100%">${playHead()}
  <div class="board small">${dialSVG(th, { guess: a.g, target: a.y })}</div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><div><div class="voice" style="font-size:30px;line-height:1.1">${yearLine(a.d)}</div><span class="lab ${a.d <= 1 ? "deep" : ""}">${a.d === 0 ? `It was ${a.y}` : `You said ${a.g} · it was ${a.y}`}</span></div><div class="big num" style="font-size:44px">+${a.pts}</div></div>
  <div class="youcard">${coverEl(s, 64, 12).replace('class="cv"', `class="cv ${on ? "spin" : ""}"`)}<div class="grow"><div class="t1" style="font-size:17px">${esc(s.t)}</div><div class="t2">${esc(s.a)}</div>
    <div class="mono" style="font-size:12px;color:var(--deep)">${chartRun(s)}</div></div>
    <button class="playbtn" data-play="${esc(s.key)}" aria-label="${on ? "Stop" : "Play"} ${esc(s.t)}">${on ? I.pause : I.play}</button>
    <button class="iconbtn ${saved ? "on" : ""}" data-save="${esc(s.key)}" aria-label="${saved ? "Remove" : "Save"} ${esc(s.t)}">${saved ? I.check : I.plus}</button></div>
  ${nb.length ? `<div style="display:flex;justify-content:space-between"><span class="lab" style="color:var(--ink)">Next to it on the ${a.y} chart</span><span class="lab">Tap to play</span></div>
  <div class="list">${nb.map(x => songRow(x, "", false)).join("")}</div>` : ""}
  <div class="sticky"><button class="btn" data-act="next">${state.run.done ? "See your record" : "Next song"}<span style="display:flex;align-items:center;gap:8px"><span class="lab" style="color:inherit;opacity:.6">${state.run.done ? "" : `${state.idx + 2} of ${N}`}</span>${I.arrow}</span></button></div>
  </div>`;
}
function viewResults() {
  const n = state.day, { theme, tracks } = tracksFor(n), r = state.run, pts = r.answers.map(a => a ? a.pts : 0);
  const scores = dayScores(n), better = scores.filter(s => s < r.score).length, top = scores.length > 1 ? Math.max(1, Math.round((1 - better / scores.length) * 100)) : null;
  const bins = Array(20).fill(0); scores.forEach(s => bins[Math.min(19, Math.floor(s / MAX * 20))]++); const mx = Math.max(1, ...bins), mine = Math.min(19, Math.floor(r.score / MAX * 20));
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null, spot = r.answers.filter(a => a && a.d === 0).length;
  return `${deskbar("home")}<div class="view">
  <div class="top mobilebar"><button class="iconbtn" data-nav="home" aria-label="Back to today">${I.close}</button><span class="lab" style="color:var(--ink)">No. ${n} · ${esc(theme.name)}</span><span style="width:34px"></span></div>
  <div class="split"><div style="display:flex;flex-direction:column;gap:22px;min-width:0">
    <div class="center mobile-only">${recordEl(pts, { arm: true, shadow: true, size: 236, label: "No. " + n })}</div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px"><span class="lab desk-only">No. ${n} · ${esc(theme.name)}</span><div style="display:flex;align-items:baseline;gap:8px"><span class="big num">${r.score}</span><span class="mono sub">/ ${MAX}</span></div><div class="voice" style="font-size:28px">${verdictLine(r.score)}</div><span class="lab">${spot} spot on</span></div>
    <div class="row2"><button class="btn" data-act="share" style="justify-content:center;gap:10px;white-space:nowrap;font-size:16px">${I.share}Share</button><button class="btn ghost" data-act="saveall" style="white-space:nowrap;font-size:16px">Save all ${N}</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="lab">Your map · white is your guess, orange is the year</span><div class="board small">${dialSVG(theme, { marks: r.answers.filter(Boolean) })}</div></div>
    ${scores.length > 1 ? `<div class="card" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><span class="lab">You vs everyone</span><div style="font-size:36px;letter-spacing:-.04em">Top ${top}%</div></div><div style="text-align:right"><div class="mono num">${scores.length.toLocaleString()}</div><span class="lab" style="font-size:10px">players</span></div></div>
      <div class="hist" aria-label="Score spread">${bins.map((b, i) => `<i class="${i === mine ? "me" : ""}" style="height:${Math.max(4, b / mx * 100)}%"></i>`).join("")}</div>
      <div style="display:flex;justify-content:space-between" class="lab"><span>0</span><span>Average ${avg}</span><span>${MAX}</span></div></div>` : ""}
    <div style="display:flex;justify-content:space-between"><span class="lab" style="color:var(--ink)">Your ${N}</span><span class="lab">Points</span></div>
    <div class="list">${tracks.map((s, i) => { const a = r.answers[i]; if (!a) return "";
      return songRow(s, a.d === 0 ? `Spot on · ${a.y}` : `You said ${a.g} · it was ${a.y}`, a.d === 0).replace(/<button class="playbtn o"/, `<span class="mono num" style="font-size:13px;color:${a.pts >= 70 ? "var(--deep)" : "var(--ink)"}">+${a.pts}</span><button class="playbtn o"`); }).join("")}</div>
    ${n === today ? `<div class="teaser"><div><span class="lab">Tomorrow</span><div style="font-weight:500">${esc(themeForDay(n + 1).name)}</div></div><span class="mono num" id="countdown"></span></div>` : ""}
  </div><div class="center desk-only">${recordEl(pts, { arm: true, shadow: true, size: 420, label: "No. " + n })}</div></div>
  </div>${mobileNav("home")}`;
}
function viewRecords() {
  const all = runs(), done = Object.values(all).filter(r => r.done), saved = savedSongs(), best = done.length ? Math.max(...done.map(r => r.score)) : 0;
  const days = []; for (let n = today; n >= Math.max(1, today - 29); n--) days.push(n);
  const body = state.tab === "records"
    ? `<div class="grid">${days.map(n => { const r = all[n], t = themeForDay(n);
        return `<button class="gitem" data-act="day" data-day="${n}">${r?.done ? `<span class="rec">${recordSVG(r.answers.map(a => a ? a.pts : 0))}</span>` : `<span class="empty-disc">${r ? "Finish" : "Play"}</span>`}
        <span class="lab" style="font-size:9px">No. ${n} · ${esc(fmtShort(dateOf(n)))}</span><span style="font-weight:500;font-size:13px;line-height:1.25">${esc(t.name)}</span><span class="mono" style="font-size:11px;color:${r?.done ? "var(--ink)" : "var(--deep)"}">${r?.done ? r.score + " pts" : n === today ? "Today" : "Not played"}</span></button>`; }).join("")}</div>`
    : savedList(saved);
  return `${deskbar("records")}<div class="view">
  <div class="top"><h2 style="font-size:30px">Your records</h2></div>
  <div class="stats"><div><b class="num">${done.length}</b><span>records</span></div><div><b class="num">${saved.length}</b><span>songs saved</span></div><div><b class="num">${streak()}</b><span>day streak</span></div><div><b class="num">${best}</b><span>best</span></div></div>
  <div class="seg" role="tablist"><button role="tab" aria-selected="${state.tab === "records"}" data-tab="records">Records</button><button role="tab" aria-selected="${state.tab === "saved"}" data-tab="saved">Saved songs</button></div>
  ${body}</div>${mobileNav("records")}`;
}
function savedList(saved) {
  if (!saved.length) return `<p class="sub">Nothing saved yet. Tap + next to any song after you hear it to keep it here.</p>`;
  return `<div class="list">${saved.map(k => BYKEY.get(k)).filter(Boolean).map(s => songRow(s, "", false)).join("")}</div>`;
}
const viewSaved = () => `${deskbar("saved")}<div class="view"><div class="top"><h2 style="font-size:30px">Saved songs</h2><span class="lab">${savedSongs().length}</span></div>${savedList(savedSongs())}</div>${mobileNav("saved")}`;
function sheetHTML() {
  const demo = { range: [1980, 2024] }, lad = [[0, "Spot on"], [1, "1 off"], [2, "2 off"], [3, "3 off"], [4, "4 off"]];
  return `<div class="scrim" data-act="closesheet"><div class="sheet how" role="dialog" aria-modal="true" aria-labelledby="howt">
  <div class="grab"></div>
  <header class="how-hd"><span class="lab">How to play</span><h2 id="howt">When was it a hit?</h2>
    <p class="sub">Five songs a day from Billboard’s year-end Hot 100, ${Y0} to ${Y1}. Each day has a theme: a decade, an artist, or a kind of song.</p></header>
  <section class="card row"><div class="board mini">${dialSVG(demo, { guess: 1997 })}</div>
    <div><div class="card-hd"><span class="stepn">1</span><h3>Listen</h3></div><p class="sub">The song plays. Going round the record is the years, starting at the top.</p></div></section>
  <section class="card row"><div class="board mini">${dialSVG(demo, { guess: 1997, target: 1999 })}</div>
    <div><div class="card-hd"><span class="stepn">2</span><h3>Drop the needle</h3></div><p class="sub">Tap the year it was a hit, drag to adjust, then drop. The real year lights up in orange.</p></div></section>
  <section class="card"><div class="card-hd"><span class="stepn">3</span><h3>Get close</h3><span class="lab">up to 100 each</span></div>
    <div class="ladder">${lad.map(([d, l]) => `<div><i style="height:${8 + SCORE[d] * .34}px;background:var(${tierVar(SCORE[d])})"></i><b>${SCORE[d]}</b><small>${l}</small></div>`).join("")}</div>
    <p class="sub">The year is when it made Billboard’s year-end chart. If it charted two years running, either one counts.</p></section>
  <button class="btn" data-act="closesheet" style="justify-content:center">Start today’s record</button></div></div>`;
}

/* ---------- render ---------- */
function render() {
  if (!THEMES) return;
  const v = state.view;
  const html = v === "prompt" ? viewPrompt() : v === "reveal" ? viewReveal() : v === "results" ? viewResults() : v === "records" ? viewRecords() : v === "saved" ? viewSaved() : viewHome();
  $("#app").innerHTML = html + (state.sheet ? sheetHTML() : "");
  document.querySelectorAll(".mobile-only").forEach(e => { e.hidden = matchMedia("(min-width:900px)").matches; });
  document.querySelectorAll(".desk-only").forEach(e => { e.hidden = !matchMedia("(min-width:900px)").matches; });
  if (v === "prompt" && state.focusBoard) $("#board")?.focus();
  updateCountdown();
}
function updateCountdown() { const el = $("#countdown"); if (!el) return; const t = dateOf(today + 1) - new Date(); const h = Math.floor(t / 3.6e6), m = Math.floor(t % 3.6e6 / 6e4), s = Math.floor(t % 6e4 / 1e3); el.textContent = [h, m, s].map(x => String(x).padStart(2, "0")).join(":"); }
setInterval(updateCountdown, 1000);
let lastW = innerWidth; addEventListener("resize", () => { if (Math.abs(innerWidth - lastW) > 40) { lastW = innerWidth; render(); } });

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-act]"); if (!t) return;
  if (t.dataset.act === "closesheet" && (t.tagName === "BUTTON" || e.target === t)) { state.sheet = false; store.set("seenHow5", true); render(); return; }
  if (t.dataset.nav) { stopAudio(); if (t.dataset.nav === "how") { state.sheet = true; render(); return; } state.view = t.dataset.nav; if (t.dataset.nav === "records") state.tab = "records"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  if (t.dataset.play) { const s = BYKEY.get(t.dataset.play); if (s) playSong(s); return; }
  if (t.dataset.save) { toggleSave(t.dataset.save); return; }
  switch (t.dataset.act) {
    case "start": startDay(today); break;
    case "day": { const n = +t.dataset.day, r = runs()[n]; if (r?.done) { state.day = n; state.run = r; state.view = "results"; render(); window.scrollTo(0, 0); } else startDay(n); break; }
    case "drop": dropNeedle(); break;
    case "next": next(); break;
    case "quit": stopAudio(); state.view = "home"; render(); toast("Progress saved"); break;
    case "share": share(); break;
    case "saveall": { const s = savedSongs(); state.run.answers.filter(Boolean).forEach(a => { if (!s.includes(a.key)) s.push(a.key); }); store.set("saved5", s); toast(`Saved your ${N}`); render(); break; }
  }
});
let dragging = false;
function placeAt(e) { const svg = $("#board svg"); if (!svg) return; const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(svg.getScreenCTM().inverse()); state.guess = yearFrom(curTheme(), p.x, p.y); updateBoard(); }
document.addEventListener("pointerdown", e => { const b = e.target.closest("#board"); if (!b || state.view !== "prompt") return; dragging = true; try { b.setPointerCapture(e.pointerId); } catch {} placeAt(e); e.preventDefault(); });
document.addEventListener("pointermove", e => { if (dragging && state.view === "prompt") placeAt(e); });
["pointerup", "pointercancel"].forEach(t => document.addEventListener(t, () => { dragging = false; }));
document.addEventListener("keydown", e => {
  if (state.view !== "prompt" || document.activeElement?.id !== "board") return;
  const th = curTheme(), mid = Math.round((th.range[0] + th.range[1]) / 2);
  if (e.key === "Enter") { dropNeedle(); return; }
  const m = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!m) return; e.preventDefault();
  state.guess = Math.max(th.range[0], Math.min(th.range[1], (state.guess ?? mid - m) + m)); updateBoard();
});
async function share() {
  const r = state.run, n = state.day, { theme } = tracksFor(n), spot = r.answers.filter(a => a && a.d === 0).length;
  const text = `needle No. ${n} · ${theme.name}\n${r.answers.map(a => !a || !a.pts ? "×" : a.d === 0 ? "●" : a.d === 1 ? "◕" : a.d === 2 ? "◑" : "◔").join(" ")}  ${r.score}/${MAX}\n${spot} spot on · ${verdictLine(r.score)}\nhfong13.github.io/needle`;
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it in your group chat."); } catch { toast(text.split("\n")[1]); }
}

/* ---------- boot ---------- */
fetch("data/charts.json").then(r => r.json()).then(j => {
  buildCatalog(j); window.__needle = { tracksFor, themeForDay, catalog: () => CATALOG, themes: () => THEMES };
  state.view = "home"; state.sheet = !store.get("seenHow5", false); render(); connectDb();
}).catch(() => { $("#app").innerHTML = `<div class="loading"><div class="wordmark">needle</div><p class="sub">The charts didn’t load. Refresh to try again.</p></div>`; });
})();
</script>

</body></html>
