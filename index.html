  let grooves = ""; for (let r = Ro; r > Ri + 0.5; r -= 1.3) grooves += `<circle cx="50" cy="50" r="${r.toFixed(2)}" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".25"/>`;
  let bands = "", r = Ro;
  pts.forEach((p, i) => { const w = p / 700 * span; if (w <= 0) return; const mid = r - w / 2;
    bands += `<circle class="band" data-i="${i}" cx="50" cy="50" r="${mid.toFixed(3)}" fill="none" stroke="var(${tierVar(p)})" stroke-width="${w.toFixed(3)}"/>`; r -= w; });
  const edge = r;
  let armSvg = "";
  if (arm) { const piv = [57.5 + 48, 5]; const th = Math.PI * 0.06; const tip = armRest ? [104, 70] : [c + edge * Math.cos(th), c + edge * Math.sin(th)];
    const dx = tip[0] - piv[0], dy = tip[1] - piv[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, hs = [tip[0] - ux * 9, tip[1] - uy * 9];

  const w = arm ? 112 : 100;
  return `<svg viewBox="0 0 ${w} 100" role="img" aria-label="Record, ${pts.reduce((a,b)=>a+b,0)} of 700 points"><g class="disc"><circle cx="50" cy="50" r="49.5" fill="${ghost ? "none" : "var(--vinyl)"}" ${ghost ? 'stroke="var(--hair)" stroke-dasharray="2 2"' : ""}/></g>${ghost ? "" : grooves + bands +
    `<path d="M50 50 m-48 0 a48 48 0 0 1 20-39" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="18"/>` +

}

      ${y?.done ? `<button class="yesterday" data-act="day" data-day="${n - 1}"><span class="rec" style="--rs:44px;width:44px;margin:0">${recordSVG(y.answers.map(a => a ? a.pts : 0))}</span><span class="grow"><span class="lab">Yesterday · ${esc(themeForDay(n - 1).name)}</span><span style="display:block;font-weight:500">${y.score} pts</span></span>${I.chev}</button>` : ""}
    </div>
    <div class="center desk-only">${recordEl(pts, { arm: true, armRest: !pts.length, shadow: true, size: 440, label: "No. " + n })}</div>
  </div></div>${nav("home").replace('class="tabbar"', 'class="tabbar mobilebar"')}`;
}
function playHead() {
  const pts = state.run.answers.map(a => a ? a.pts : 0);
  return `<div class="playhead"><button class="iconbtn" data-act="quit" aria-label="Leave and save progress">${I.close}</button>
  <div class="steps" aria-label="Prompt ${state.idx + 1} of 7">${Array.from({ length: 7 }, (_, i) => `<i class="${i < state.run.answers.length && !(state.view === "prompt" && i === state.idx) ? "done" : ""} ${i === state.idx ? "now" : ""}"></i>`).join("")}</div>
  <div class="score-mini"><span class="rec" style="--rs:24px;width:24px;margin:0">${recordSVG(pts)}</span><span class="num">${state.run.score}</span></div></div>`;
}
function viewPrompt() {
  const { theme, prompts } = promptsFor(state.day), p = prompts[state.idx];
  return `<div class="view" style="max-width:640px;margin:0 auto;width:100%">${playHead()}
  <div class="timer"><div class="bar"><span style="transform:scaleX(${state.timeLeft / PROMPT_SECONDS})"></span></div><span class="t">0:${String(Math.ceil(state.timeLeft)).padStart(2, "0")}</span></div>
  <div class="q"><span class="lab">Prompt ${state.idx + 1} of 7 · ${esc(theme.name)}</span><h2>${esc(p.text)}</h2><span class="sub">${esc(theme.scope)}</span></div>
  <form class="inputrow" id="f" autocomplete="off"><label for="answer" class="vh">Song title or artist</label>
    <input id="answer" type="text" placeholder="Type a song title" value="${esc(state.typed)}" enterkeyhint="go" spellcheck="false" autocapitalize="off">
    <button class="go ${state.typed.trim().length > 1 ? "ready" : ""}" type="submit" aria-label="Submit answer">${I.arrow}</button></form>
  ${state.err ? `<p class="err" role="alert">${esc(state.err)}</p>` : ""}
  <div class="hint ${playingKey === "hint" ? "playing" : ""}"><button data-act="hint" ${state.hintUsed ? "disabled" : ""}>${wave()} ${state.hintUsed ? "Hint used" : "Blanking? Hear a 3-sec hint"}</button><span class="lab">½ points</span></div>
  </div>`;
}
function suggHTML() {
  if (!state.sugg.length) return state.typed.length >= 2 ? `<p class="sub" style="margin:0">No songs match “${esc(state.typed)}”. Try the artist’s name.</p>` : "";
  return `<div class="sugg" role="listbox" aria-label="Matching songs">${state.sugg.map((s, i) => `<button role="option" aria-selected="${i === state.sel}" class="${i === state.sel ? "on" : ""}" data-pick="${i}">${coverEl(s, 36, 7)}<span class="meta"><span class="t1" style="display:block">${esc(s.t)}</span><span class="t2" style="display:block">${esc(s.a)}</span></span>${i === state.sel ? '<span class="kbd">return</span>' : ""}</button>`).join("")}</div>`;
}
function songRow(s, p, role, roleDeep) {
  const pts = scoreFor(s, p), saved = savedSongs().includes(s.key), on = playingKey === s.key;
  return `<div class="lrow"><span class="tier" style="background:var(${tierVar(pts)})"></span><span class="cv-wrap">${coverEl(s, 44).replace('class="cv"', `class="cv ${on ? "spin" : ""}"`)}</span>
  <span class="grow">${role ? `<span class="lab ${roleDeep ? "deep" : ""}" style="font-size:10px;display:block">${role}</span>` : ""}<span class="t1" style="display:block">${esc(s.t)}</span><span class="t2" style="display:block">${esc(s.a)} · ${rankLine(s, p)}</span></span>
  <button class="playbtn o" data-play="${esc(s.key)}" aria-label="${on ? "Stop" : "Play"} ${esc(s.t)}">${on ? I.pause : I.play}</button>
  <button class="iconbtn ${saved ? "on" : ""}" data-save="${esc(s.key)}" aria-label="${saved ? "Remove" : "Save"} ${esc(s.t)}">${saved ? I.check : I.plus}</button></div>`;
}
function otherAnswers(p, mine, idx) {
  const st = dayStats(state.day), c = st.counts[idx], said = k => c.get(k) || 0, others = st.players > (mine ? 1 : 0);
  const pool = p.answers.filter(s => s.key !== mine), byRank = pool.slice().sort((a, b) => bestRank(a, p) - bestRank(b, p));
  if (!byRank.length) return [];
  let most = byRank[0];
  if (others) { const top = pool.slice().sort((a, b) => said(b.key) - said(a.key))[0]; if (top && said(top.key) > 0) most = top; }
  const nobody = byRank.slice().reverse().find(s => !said(s.key) && s !== most) || byRank[byRank.length - 1];
  const mid = byRank[Math.floor(byRank.length / 2)] !== most && byRank[Math.floor(byRank.length / 2)] !== nobody ? byRank[Math.floor(byRank.length / 2)] : byRank.find(s => s !== most && s !== nobody);
  return [[others && said(most.key) ? "Most said" : "The obvious one", most, false], [mid && "In between", mid, false], [others ? "Nobody said" : "The deepest cut", nobody, true]].filter(x => x[1]);
}
function viewReveal() {
  const { prompts } = promptsFor(state.day), p = prompts[state.idx], a = state.run.answers[state.idx];
  const song = a && BYKEY.get(a.key), pts = state.run.answers.map(x => x ? x.pts : 0);
  const base = a ? (a.ok ? scoreFor(song, p) : 0) : 0, lines = REACT[a?.ok ? base : 0], onChart = song && p.years.some(y => song.ranks[y] != null);
  const line = a?.dupe ? "You already used that one today." : !a ? "Out of time." : !a.ok ? (onChart ? "Right chart, wrong prompt." : "Not on that chart.") : lines[state.idx % 2];
  const st = dayStats(state.day), said = song ? (st.counts[state.idx].get(song.key) || 0) : 0, pct = st.players > 1 && song ? Math.round(said / st.players * 100) : null;
  const tier = a?.ok ? tierOf(song.pts)[2] : "";
  return `<div class="view" style="max-width:640px;margin:0 auto;width:100%">${playHead()}
  <div class="verdict"><div class="rec shadow" style="--rs:160px;aspect-ratio:112/100">${recordSVG(pts, { arm: true })}</div>
    <div style="min-width:0"><div class="big num">+${a ? a.pts : 0}</div><div class="voice" style="font-size:24px;line-height:1.1">${esc(line)}</div>${tier ? `<span class="lab deep">${tier}${a.hint ? " · hint, half points" : ""}</span>` : ""}</div></div>
  ${song ? `<div class="youcard">${coverEl(song, 64, 12).replace('class="cv"', `class="cv ${playingKey === song.key ? "spin" : ""}"`)}<div class="grow"><span class="lab" style="font-size:10px">Your answer</span><div class="t1" style="font-size:17px">${esc(song.t)}</div><div class="t2">${esc(song.a)}</div>
    <div class="mono" style="font-size:12px;color:${a.ok ? "var(--deep)" : "var(--mute)"}">${a.ok ? rankLine(song, p) + (pct != null ? ` · ${pct}% said it` : "") : a.dupe ? "Already used today" : "Doesn’t fit this prompt"}</div></div>
    <button class="playbtn" data-play="${esc(song.key)}" aria-label="Play ${esc(song.t)}">${playingKey === song.key ? I.pause : I.play}</button></div>` : ""}
  <div style="display:flex;justify-content:space-between"><span class="lab" style="color:var(--ink)">Other answers</span><span class="lab">Tap to play</span></div>
  <div class="list">${otherAnswers(p, song?.key, state.idx).map(([r, s, d]) => songRow(s, p, r, d)).join("")}</div>
  <div class="sticky"><button class="btn" data-act="next">${state.run.done ? "See your record" : "Next prompt"}<span style="display:flex;align-items:center;gap:8px"><span class="lab" style="color:inherit;opacity:.6">${state.run.done ? "" : `${state.idx + 2} of 7`}</span>${I.arrow}</span></button></div>
  </div>`;
}
function verdictLine(score) { return score >= 600 ? "Played to the label." : score >= 450 ? "Deep in the grooves." : score >= 300 ? "Halfway to the label." : score >= 150 ? "Just past the edge." : "Barely scratched it."; }
function viewResults() {
  const n = state.day, { theme, prompts } = promptsFor(n), r = state.run, pts = r.answers.map(a => a ? a.pts : 0);
  const st = dayStats(n), scores = st.scores, better = scores.filter(s => s < r.score).length, top = scores.length > 1 ? Math.max(1, Math.round((1 - better / scores.length) * 100)) : null;
  const bins = Array(24).fill(0); scores.forEach(s => bins[Math.min(23, Math.floor(s / 700 * 24))]++); const mx = Math.max(1, ...bins), mine = Math.min(23, Math.floor(r.score / 700 * 24));
  const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
  const nextN = today + 1, nextTheme = themeForDay(nextN);
  return `${deskbar("home")}<div class="view">
  <div class="top mobilebar"><button class="iconbtn" data-nav="home" aria-label="Back to today">${I.close}</button><span class="lab" style="color:var(--ink)">No. ${n} · ${esc(theme.name)}</span><span style="width:34px"></span></div>
  <div class="split"><div style="display:flex;flex-direction:column;gap:22px;min-width:0">
    <div class="center mobile-only">${recordEl(pts, { arm: true, shadow: true, size: 236, label: "No. " + n })}</div>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px"><span class="lab desk-only">No. ${n} · ${esc(theme.name)}</span><div style="display:flex;align-items:baseline;gap:8px"><span class="big num">${r.score}</span><span class="mono sub">/ 700</span></div><div class="voice" style="font-size:28px">${verdictLine(r.score)}</div></div>
    <div class="row2"><button class="btn" data-act="share" style="justify-content:center;gap:10px;white-space:nowrap;font-size:16px">${I.share}Share</button><button class="btn ghost" data-act="saveall" style="white-space:nowrap;font-size:16px">Save all 7</button></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      ${scores.length > 1 ? `<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><span class="lab">You vs everyone</span><div style="font-size:36px;letter-spacing:-.04em">Top ${top}%</div></div><div style="text-align:right"><div class="mono num">${scores.length.toLocaleString()}</div><span class="lab" style="font-size:10px">players</span></div></div>
      <div class="hist" aria-label="Score spread">${bins.map((b, i) => `<i class="${i === mine ? "me" : ""}" style="height:${Math.max(4, b / mx * 100)}%"></i>`).join("")}</div>
      <div style="display:flex;justify-content:space-between" class="lab"><span>0</span><span>Average ${avg}</span><span>700</span></div>`
      : `<span class="lab">You vs everyone</span><p class="sub" style="margin:0">${db ? "You’re the first to finish today’s record. The spread fills in as others play." : "Scores from other players show up when you open needle signed in to Claude."}</p>`}
    </div>
    <div style="display:flex;justify-content:space-between"><span class="lab" style="color:var(--ink)">Your seven</span><span class="lab">Rank · points</span></div>
    <div class="list">${prompts.map((p, i) => { const a = r.answers[i], s = a && BYKEY.get(a.key);
      return s ? songRow(s, p, p.label, false).replace(/<button class="playbtn o"/, `<span class="mono num" style="font-size:13px;color:${a.pts >= 85 ? "var(--deep)" : "var(--ink)"}">+${a.pts}</span><button class="playbtn o"`)
               : `<div class="lrow"><span class="tier" style="background:var(--hair)"></span><span class="grow"><span class="lab" style="font-size:10px;display:block">${esc(p.label)}</span><span class="t2">No answer</span></span><span class="mono" style="font-size:13px">+0</span></div>`; }).join("")}</div>
    ${n === today ? `<div class="teaser"><div><span class="lab">Tomorrow</span><div style="font-weight:500">${esc(nextTheme.name)}</div></div><span class="mono num" id="countdown"></span></div>` : ""}
  </div><div class="center desk-only">${recordEl(pts, { arm: true, shadow: true, size: 420, label: "No. " + n })}</div></div>
  </div>${nav("home").replace('class="tabbar"', 'class="tabbar mobilebar"')}`;
}
function viewRecords() {
  const all = runs(), done = Object.values(all).filter(r => r.done), saved = savedSongs();
  const best = done.length ? Math.max(...done.map(r => r.score)) : 0;
  const days = []; for (let n = today; n >= Math.max(1, today - 29); n--) days.push(n);
  const body = state.tab === "records"
    ? `<div class="grid">${days.map(n => { const r = all[n], t = themeForDay(n);
        return `<button class="gitem" data-act="day" data-day="${n}">${r?.done ? `<span class="rec">${recordSVG(r.answers.map(a => a ? a.pts : 0))}</span>` : `<span class="empty-disc">${r ? "Finish" : "Play"}</span>`}
        <span class="lab" style="font-size:9px">No. ${n} · ${esc(fmtShort(dateOf(n)))}</span><span style="font-weight:500;font-size:13px;line-height:1.25">${esc(t.name)}</span><span class="mono" style="font-size:11px;color:${r?.done ? "var(--ink)" : "var(--deep)"}">${r?.done ? r.score + " pts" : n === today ? "Today" : "Not played"}</span></button>`; }).join("")}</div>`

function savedList(saved) {
  if (!saved.length) return `<p class="sub">Nothing saved yet. Tap + next to any song on a reveal to keep it here.</p>`;
  const fake = { years: YEARS };
  return `<div class="list">${saved.map(k => BYKEY.get(k)).filter(Boolean).map(s => songRow(s, fake, "", false)).join("")}</div>`;
}
function viewSaved() { return `${deskbar("saved")}<div class="view"><div class="top"><h2 style="font-size:30px">Saved songs</h2><span class="lab">${savedSongs().length}</span></div>${savedList(savedSongs())}</div>${nav("saved").replace('class="tabbar"', 'class="tabbar mobilebar"')}`; }
function sheetHTML() {

  <header class="how-hd"><span class="lab">How to play</span><h2 id="howt">Name the biggest songs of the late 2000s.</h2>

  <section class="card"><div class="card-hd"><span class="num">1</span><h3>Answer the prompt</h3><span class="lab">25 sec</span></div>
    <div class="mock"><span class="mock-q">Name a love song from 2008.</span><span class="mock-in">In Love with a Gi<i></i></span></div>
    <p class="sub">Type the title. Anything that doesn’t fit is ignored, so keep guessing until the clock runs out.</p></section>
  <section class="card"><div class="card-hd"><span class="num">2</span><h3>Go deep for points</h3><span class="lab">7 prompts</span></div>
    ${ex.map(exRow).join("")}
    <div class="ladder">${tiers.map(([p, r]) => `<div><i style="height:${8 + p * .34}px;background:var(${tierVar(p)})"></i><b>${p}</b><small>${r}</small></div>`).join("")}</div>
    <p class="sub">Songs are scored on how well-known they are today: how high and how long they charted, plus how much they still get played. A hint halves the points.</p></section>
  <section class="card row"><span class="rec" style="--rs:96px;width:96px">${recordSVG([100, 85, 60, 30], { label: "" })}</span>
    <div><div class="card-hd"><span class="num">3</span><h3>Fill your record</h3></div><p class="sub">Points fill it from the edge in. 700 fills it. Then hear the songs you missed.</p></div></section>

/* ---------- render ---------- */
function render() {
  if (!DATA) return;
  const app = $("#app"); const v = state.view;
  const html = v === "home" ? viewHome() : v === "prompt" ? viewPrompt() : v === "reveal" ? viewReveal() : v === "results" ? viewResults() : v === "records" ? viewRecords() : v === "saved" ? viewSaved() : viewHome();
  const focused = document.activeElement?.id, caret = focused === "answer" ? document.activeElement.selectionStart : null;
  app.innerHTML = html + (state.sheet ? sheetHTML() : "");
  document.querySelectorAll(".mobile-only").forEach(e => { e.hidden = matchMedia("(min-width:900px)").matches; });
  document.querySelectorAll(".desk-only").forEach(e => { e.hidden = !matchMedia("(min-width:900px)").matches; });

  updateCountdown();
}
function updateCountdown() { const el = $("#countdown"); if (!el) return; const t = dateOf(today + 1) - new Date(); const h = Math.floor(t / 3.6e6), m = Math.floor(t % 3.6e6 / 6e4), s = Math.floor(t % 6e4 / 1e3); el.textContent = [h, m, s].map(x => String(x).padStart(2, "0")).join(":"); }
setInterval(updateCountdown, 1000);
addEventListener("resize", () => render());

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-act]"); if (!t) return;
  if (t.dataset.act === "closesheet" && (t.tagName === "BUTTON" || e.target === t)) { state.sheet = false; store.set("seenHow", true); render(); return; }
  if (t.dataset.nav) { stopAudio(); clearInterval(tick); if (t.dataset.nav === "how") { state.sheet = true; render(); return; } state.view = t.dataset.nav; if (t.dataset.nav === "records") state.tab = "records"; render(); window.scrollTo(0, 0); return; }
  if (t.dataset.tab) { state.tab = t.dataset.tab; render(); return; }
  if (t.dataset.pick != null) { const s = state.sugg[+t.dataset.pick]; if (s) submit(s); return; }
  if (t.dataset.play) { const s = BYKEY.get(t.dataset.play); if (s) playSong(s); return; }
  if (t.dataset.save) { toggleSave(t.dataset.save); return; }
  switch (t.dataset.act) {

    case "day": { const n = +t.dataset.day, r = runs()[n]; if (r?.done) { state.day = n; state.run = r; state.view = "results"; render(); window.scrollTo(0, 0); } else startDay(n); break; }
    case "hint": useHint(); break;
    case "next": next(); break;
    case "quit": clearInterval(tick); stopAudio(); state.view = "home"; render(); toast("Progress saved"); break;
    case "share": share(); break;
    case "saveall": { const s = savedSongs(); state.run.answers.filter(Boolean).forEach(a => { if (!s.includes(a.key)) s.push(a.key); }); store.set("saved", s); toast("Saved your seven"); render(); break; }
  }
});
document.addEventListener("input", e => {
  if (e.target.id !== "answer") return; state.typed = e.target.value;
  if (state.err) { state.err = ""; $(".err")?.remove(); }
  $(".go")?.classList.toggle("ready", state.typed.trim().length > 1);
});
document.addEventListener("submit", e => {
  e.preventDefault(); if (e.target.id !== "f" || state.typed.trim().length < 1) return;
  const { prompts } = promptsFor(state.day), p = prompts[state.idx], used = state.run.answers.filter(Boolean).map(a => a.key);
  const cands = matchTitle(state.typed);
  if (!cands.length) { state.err = `Couldn’t find “${state.typed.trim()}” on any year-end chart. Check the spelling.`; state.typed = ""; render(); const i = $("#answer"); if (i) { i.value = ""; i.focus(); } return; }
  submit(cands.find(c => p.answers.includes(c) && !used.includes(c.key)) || cands[0]);

async function share() {
  const r = state.run, n = state.day, { theme } = promptsFor(n);
  const text = `needle No. ${n} · ${theme.name}\n${r.answers.map(a => SHARE_GLYPH(a ? a.pts : 0)).join(" ")}  ${r.score}/700\n${verdictLine(r.score)}\nhfong13.github.io/needle`;
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it in your group chat."); } catch { toast(text.split("\n")[1]); }

/* ---------- boot ---------- */
Promise.all([fetch("data/songs.json").then(r => r.json()), fetch("data/tags.json").then(r => r.json())]).then(([j, tg]) => {
  TAGMAP = tg; buildCatalog(j); window.__needle = { promptsFor, catalog: () => CATALOG, themes: () => THEMES.map(t => t.name) }; state.view = "home"; state.sheet = !store.get("seenHow", false); render(); connectDb();
}).catch(() => { $("#app").innerHTML = `<div class="loading"><div class="wordmark">needle</div><p class="sub">The charts didn’t load. Refresh to try again.</p></div>`; });
})();
</script>
